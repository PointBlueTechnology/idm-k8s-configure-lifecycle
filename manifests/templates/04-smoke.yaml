# ${LIFECYCLE_NAME} Job — smoke (template; render with scripts/render.sh)
apiVersion: batch/v1
kind: Job
metadata:
  name: ${LIFECYCLE_NAME}-04-smoke
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/part-of: ${LIFECYCLE_NAME}
    app.kubernetes.io/component: smoke
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: ${LIFECYCLE_NAME}
        app.kubernetes.io/component: smoke
    spec:
      restartPolicy: Never
      serviceAccountName: ${LIFECYCLE_NAME}
      volumes:
        - name: lifecycle
          configMap:
            name: ${LIFECYCLE_NAME}-scripts
            defaultMode: 0755
      containers:
        - name: smoke
          image: ${SMOKE_IMAGE}
          imagePullPolicy: ${IMAGE_PULL_POLICY}
          command: ["/bin/sh", "/lifecycle/04-smoke.sh"]
          env:
            - name: EXT_HOST
              value: "${PUBLIC_HOST}"
            - name: INGRESS_IP
              value: "${INGRESS_IP}"
          volumeMounts:
            - name: lifecycle
              mountPath: /lifecycle
              readOnly: true
