# idm-lifecycle Job — oauth (template; render with scripts/render.sh)
apiVersion: batch/v1
kind: Job
metadata:
  name: idm-lifecycle-03-oauth-harden
  namespace: idm
  labels:
    app.kubernetes.io/part-of: idm-lifecycle
    app.kubernetes.io/component: oauth
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: idm-lifecycle
        app.kubernetes.io/component: oauth
    spec:
      restartPolicy: Never
      serviceAccountName: idm-lifecycle
      volumes:
        - name: shared
          persistentVolumeClaim:
            claimName: idm-shared
        - name: lifecycle
          configMap:
            name: idm-lifecycle-scripts
            defaultMode: 0755
        - name: lifecycle-lib
          configMap:
            name: idm-lifecycle-lib
            defaultMode: 0444
      containers:
        - name: oauth
          image: identityapplication:idm-4.10.2.0200-81
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "/lifecycle/03-oauth-harden.sh"]
          env:
            - name: ID_VAULT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: idm-common-password
                  key: password
            - name: UA_WFE_DATABASE_PWD
              valueFrom:
                secretKeyRef:
                  name: idm-common-password
                  key: password
            - name: UA_ADMIN_PWD
              valueFrom:
                secretKeyRef:
                  name: idm-common-password
                  key: password
            - name: SSO_SERVICE_PWD
              valueFrom:
                secretKeyRef:
                  name: idm-common-password
                  key: password
            - name: COMMON_KEYSTORE_PWD
              valueFrom:
                secretKeyRef:
                  name: identity-manager-key-store-pwd
                  key: keystore-pwd
            - name: MASTER_KEYSTORE_PWD
              valueFrom:
                secretKeyRef:
                  name: identity-manager-key-store-pwd
                  key: keystore-pwd
            - name: SHARED_CONFIG
              value: "/config"
            - name: ENGINE_HOST
              value: "idm-engine.example.com"
            - name: ENGINE_IP
              value: "192.0.2.10"
            - name: PG_HOST
              value: "192.0.2.10"
            - name: PG_PORT
              value: "5432"
            - name: EXT_HOST
              value: "idm.example.com"
            - name: EXT_URL
              value: "https://idm.example.com"
            - name: UA_APP_CTX
              value: "${UA_APP_CTX}"
            - name: FORMRENDERER_CONFIG_DIR
              value: "${FORMRENDERER_CONFIG_DIR}"
            - name: INGRESS_IP
              value: "192.0.2.20"
            - name: VAULT_ADMIN_DN
              value: "cn=admin,ou=sa,o=system"
            - name: UA_WFE_DATABASE_USER
              value: "idmadmin"
            - name: UA_DATABASE_NAME
              value: "idmuserappdb"
            - name: WFE_DATABASE_NAME
              value: "igaworkflowdb"
            - name: LIFECYCLE_LIB
              value: "/lifecycle/lib/idm-lifecycle-lib.jar"
          volumeMounts:
            - name: shared
              mountPath: /config
            - name: lifecycle
              mountPath: /lifecycle
              readOnly: true
            - name: lifecycle-lib
              mountPath: /lifecycle/lib
              readOnly: true
