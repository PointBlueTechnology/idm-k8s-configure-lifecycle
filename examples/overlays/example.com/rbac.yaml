# ServiceAccount + Role for lifecycle Jobs (scale UA, read secrets/CMs)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: idm-lifecycle
  namespace: idm
  labels:
    app.kubernetes.io/part-of: idm-lifecycle
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: idm-lifecycle
  namespace: idm
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale"]
    verbs: ["get", "list", "patch", "update"]
  - apiGroups: [""]
    resources: ["pods", "pods/log", "pods/exec", "services", "secrets", "configmaps", "persistentvolumeclaims"]
    verbs: ["get", "list", "create", "update", "patch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: idm-lifecycle
  namespace: idm
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: idm-lifecycle
subjects:
  - kind: ServiceAccount
    name: idm-lifecycle
    namespace: idm
---
# Backup CronJob SA. It can exec into namespace pods (in-cluster vault) but
# cannot read Secrets through the API. The NICI password and SSH key are
# mounted into the pod by the kubelet.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: idm-lifecycle-edir-backup
  namespace: idm
  labels:
    app.kubernetes.io/part-of: idm-lifecycle
    app.kubernetes.io/component: edir-backup
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: idm-lifecycle-edir-backup
  namespace: idm
  labels:
    app.kubernetes.io/part-of: idm-lifecycle
    app.kubernetes.io/component: edir-backup
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["services", "endpoints"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: idm-lifecycle-edir-backup
  namespace: idm
  labels:
    app.kubernetes.io/part-of: idm-lifecycle
    app.kubernetes.io/component: edir-backup
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: idm-lifecycle-edir-backup
subjects:
  - kind: ServiceAccount
    name: idm-lifecycle-edir-backup
    namespace: idm
